components:
  schemas:
    ResponseOk:
      type: object
      properties:
        _result:
          description: Operation result (shape depends on the endpoint)
          nullable: true
        _info:
          $ref: '#/components/schemas/Info'
        _error:
          type: array
          items:
            type: object
          example: []
    ResponseNotFound:
      type: object
      properties:
        _result:
          type: array
          items:
            type: object
          example: []
        _info:
          $ref: '#/components/schemas/Info'
        _error:
          $ref: '#/components/schemas/ErrorNotFound'
    ResponseUnprocessableContent:
      type: object
      properties:
        _result:
          type: array
          items:
            type: object
          example: []
        _info:
          $ref: '#/components/schemas/Info'
        _error:
          $ref: '#/components/schemas/ErrorUnprocessableContent'
    Info:
      type: object
      properties:
        host:
          type: string
        uri:
          type: string
        method:
          type: string
        params:
          type: array
          items:
            type: object
        time:
          type: number
        status:
          type: integer
    Clock:
      type: object
      properties:
        date:
          type: string
        timezone_type:
          type: integer
        timezone:
          type: string
    ErrorNotFound:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        status_code:
          type: integer
          example: 404
        message:
          type: string
        reference:
          type: string
        action:
          type: string
    ErrorUnprocessableContent:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        status_code:
          type: integer
          example: 422
        message:
          type: string
        reference:
          type: string
        action:
          type: string

    ApiError:
      type: object
      description: >
        Body of every error response. `code` is a stable identifier (e.g. `security.bad_credentials`,
        `note.not_found`) meant to be mapped to a translation key by clients.
      properties:
        code:
          type: string
          example: note.not_found
        message:
          type: string
        params:
          type: array
          items:
            type: object
        status:
          type: integer
          example: 404
      required:
        - code
        - message
        - status

    FiltersParameter:
      type: string
      example: '[{"field":"name","operator":"like","value":"Digi"}]'

    PageParameter:
      type: integer
      example: 1

    ItemsPerPageParameter:
      type: integer
      example: 12

    OrderByParameter:
      type: string
      example: ''

    OrderDirection:
      type: string
      example: ''