paths:

  /me:

    get:
      summary: Current user profile
      description: The user identified by the access token.
      security:
        - Bearer: [ ]
      tags:
        - User
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    patch:
      summary: Update the current user's username and/or UI language
      security:
        - Bearer: [ ]
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200':
          description: Updated
        '400':
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /signup:
    post:
      summary: Public self-registration
      description: >
        Creates a new user account, always inactive and with an unvalidated email.
        An activation email is sent (when enabled) with a link to POST /users/activate.
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Created
        '400':
          description: Invalid data
        '403':
          description: User registration is disabled (USER_REGISTRATION_ENABLED=false)
        '409':
          description: Email already exists
        '500':
          description: Internal server error

  /users/activate:
    post:
      summary: Activate a self-registered account
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateAccountRequest'
      responses:
        '200':
          description: Activated
        '400':
          description: Invalid data
        '404':
          description: Unknown activation token
        '410':
          description: Activation token expired
        '500':
          description: Internal server error

  /users:
    post:
      summary: Create user (admin only)
      security:
        - Bearer: [ ]
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — requires ROLE_ADMIN
        '500':
          description: Internal server error

    get:
      summary: Search users
      tags:
        - User
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
        '500':
          description: Internal server error

  /users/{id}:

    patch:
      summary: Update user
      security:
        - Bearer: [ ]
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: string
            format: uuid
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated
        '500':
          description: Internal server error

    delete:
      summary: Delete user
      security:
        - Bearer: [ ]
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: string
            format: uuid
      tags:
        - User
      responses:
        '200':
          description: Deleted
        '500':
          description: Internal server error

    get:
      summary: Get user
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: string
            format: uuid
      tags:
        - User
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
        '500':
          description: Internal server error

  /me/password:
    patch:
      summary: Change the current user's password
      description: >
        Replaces the password of the authenticated user. The current password is always verified and
        the new one must be different (8-44 characters). On success every token issued before the
        change stops working, so the client must log in again, and a notice email is sent.
        Three wrong current passwords lock the endpoint for that user (429 with Retry-After).
      security:
        - Bearer: [ ]
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCurrentUserPasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          description: Invalid data (missing field, wrong type or new password outside 8-44 characters)
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The user no longer exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: >
            `user.invalid_password` (wrong current password), `user.password_unchanged`
            (new equals current) or `user.invalid_new_password`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Too many failed attempts (`user.change_password_rate_limited`)
          headers:
            Retry-After:
              description: Seconds until a new attempt is accepted
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
