components:
  schemas:

    UserCreateRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        password:
          type: string
        username:
          type: string

      required:
        - email
        - password

    SignUpRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        password:
          type: string
          minLength: 8
        username:
          type: string
      required:
        - email
        - password

    ActivateAccountRequest:
      type: object
      properties:
        token:
          type: string
      required:
        - token

    UserUpdateRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: integer
          default: 0
        active:
          type: boolean
          default: true
        emailValidated:
          type: boolean
          default: true
        locale:
          type: string
          enum: [ en, es ]

    UserDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        role:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        active:
          type: boolean
          default: true
        emailValidated:
          type: boolean
          default: true
        locale:
          type: string
          enum: [ en, es ]
        createdAt:
          type: datetime
        lastLoginAt:
          type: datetime

    UserItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        createdAt:
          type: datetime
        lastLoginAt:
          type: datetime

    UsersResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserItemResponse'
        size:
          type: integer
        total:
          type: integer
        page:
          type: integer
        last:
          type: integer

    ChangeCurrentUserPasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
          maxLength: 44
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 44
      required:
        - current_password
        - new_password
      additionalProperties: false

    CurrentUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        locale:
          type: string
          enum: [ en, es ]
          description: UI language preference
        roles:
          type: array
          items:
            type: string
        active:
          type: boolean
        email_validated:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true

    UpdateCurrentUserRequest:
      type: object
      description: Only these fields are editable through `/me`; any other field is ignored.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
        locale:
          type: string
          enum: [ en, es ]
