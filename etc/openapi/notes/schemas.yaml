components:
  schemas:

    CreatedResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id

    CreateFolderRequest:
      type: object
      properties:
        icon:
          type: string
          maxLength: 32
          nullable: true
          description: A single emoji chosen by the user; null means the default icon for the item type.
        name:
          type: string
          minLength: 1
          maxLength: 255
        parent_folder_id:
          type: string
          format: uuid
          nullable: true
      required:
        - name

    UpdateFolderRequest:
      type: object
      description: The fields to change; the ones that are not sent stay as they are.
      properties:
        icon:
          type: string
          maxLength: 32
          nullable: true
          description: A single emoji chosen by the user; null means the default icon for the item type.
        name:
          type: string
          minLength: 1
          maxLength: 255

    MoveFolderRequest:
      type: object
      properties:
        parent_folder_id:
          type: string
          format: uuid
          nullable: true

    MoveNoteRequest:
      type: object
      properties:
        folder_id:
          type: string
          format: uuid
          nullable: true
        parent_note_id:
          type: string
          format: uuid
          nullable: true
          description: Place it under this note instead of in a folder (never both).

    CreateNoteRequest:
      type: object
      properties:
        icon:
          type: string
          maxLength: 32
          nullable: true
          description: A single emoji chosen by the user; null means the default icon for the item type.
        title:
          type: string
          minLength: 1
          maxLength: 255
        content:
          type: string
          description: Markdown
        folder_id:
          type: string
          format: uuid
          nullable: true
        parent_note_id:
          type: string
          format: uuid
          nullable: true
          description: Place it under this note instead of in a folder (never both).
        pinned:
          type: boolean
          default: false
        tags:
          $ref: '#/components/schemas/TagNames'
      required:
        - title

    UpdateNoteRequest:
      type: object
      properties:
        icon:
          type: string
          maxLength: 32
          nullable: true
          description: A single emoji chosen by the user; null means the default icon for the item type.
        title:
          type: string
          minLength: 1
          maxLength: 255
        content:
          type: string
          description: Markdown
        pinned:
          type: boolean
        tags:
          $ref: '#/components/schemas/TagNames'

    UploadAttachmentRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
        - file

    FolderSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        icon:
          type: string
          maxLength: 32
          nullable: true
          description: A single emoji chosen by the user; null means the default icon for the item type.
        name:
          type: string
        created_at:
          type: string
          format: date-time

    NoteSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        icon:
          type: string
          maxLength: 32
          nullable: true
          description: A single emoji chosen by the user; null means the default icon for the item type.
        title:
          type: string
        child_count:
          type: integer
          description: Live children (notes and links) directly under it.
        pinned:
          type: boolean
        is_encrypted:
          type: boolean
          description: The content is ciphertext produced by the client (it starts with `lnenc:`); the server cannot read it.
        tags:
          $ref: '#/components/schemas/TagNames'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AttachmentSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        file_name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time

    FolderContentsResponse:
      type: object
      properties:
        folder:
          type: object
          nullable: true
          description: The listed folder; null at the root level.
          properties:
            id:
              type: string
              format: uuid
            icon:
              type: string
              maxLength: 32
              nullable: true
              description: A single emoji chosen by the user; null means the default icon for the item type.
            name:
              type: string
            parent_folder_id:
              type: string
              format: uuid
              nullable: true
            path:
              $ref: '#/components/schemas/AncestorPath'
        subfolders:
          type: array
          items:
            $ref: '#/components/schemas/FolderSummary'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/NoteSummary'
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkSummary'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentSummary'

    NoteDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        icon:
          type: string
          maxLength: 32
          nullable: true
          description: A single emoji chosen by the user; null means the default icon for the item type.
        title:
          type: string
        content:
          type: string
          description: Markdown
        folder_id:
          type: string
          format: uuid
          nullable: true
        parent_note_id:
          type: string
          format: uuid
          nullable: true
          description: The note it is placed under, if any.
        path:
          $ref: '#/components/schemas/AncestorPath'
        child_count:
          type: integer
          description: Live children (notes and links) directly under it.
        pinned:
          type: boolean
        is_encrypted:
          type: boolean
          description: The content is ciphertext produced by the client (it starts with `lnenc:`); the server cannot read it.
        tags:
          $ref: '#/components/schemas/TagNames'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        attachments:
          type: array
          description: Attachments bound to the note (not in the trash)
          items:
            $ref: '#/components/schemas/AttachmentSummary'

    AttachmentDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        folder_id:
          type: string
          format: uuid
          nullable: true
          description: Set when the file lives in a folder; null for note attachments
        note_id:
          type: string
          format: uuid
          nullable: true
          description: Set when the file is bound to a note; null for folder attachments
        file_name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time

    TrashResponse:
      type: object
      properties:
        folders:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              icon:
                type: string
                maxLength: 32
                nullable: true
                description: A single emoji chosen by the user; null means the default icon for the item type.
              name:
                type: string
              parent_folder_id:
                type: string
                format: uuid
                nullable: true
              deleted_at:
                type: string
                format: date-time
        notes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              icon:
                type: string
                maxLength: 32
                nullable: true
                description: A single emoji chosen by the user; null means the default icon for the item type.
              title:
                type: string
              folder_id:
                type: string
                format: uuid
                nullable: true
              deleted_at:
                type: string
                format: date-time
        links:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              icon:
                type: string
                maxLength: 32
                nullable: true
                description: A single emoji chosen by the user; null means the default icon for the item type.
              title:
                type: string
              url:
                type: string
              folder_id:
                type: string
                format: uuid
                nullable: true
              deleted_at:
                type: string
                format: date-time
        attachments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              file_name:
                type: string
              folder_id:
                type: string
                format: uuid
                nullable: true
              note_id:
                type: string
                format: uuid
                nullable: true
              deleted_at:
                type: string
                format: date-time

    TagNames:
      type: array
      description: >
        Free-form labels. Names are trimmed and lower-cased, duplicates collapse; at most 20 tags of 1-50 characters.
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 50

    PageMeta:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
        last_page:
          type: integer

    NoteListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        icon:
          type: string
          maxLength: 32
          nullable: true
          description: A single emoji chosen by the user; null means the default icon for the item type.
        title:
          type: string
        folder_id:
          type: string
          format: uuid
          nullable: true
        parent_note_id:
          type: string
          format: uuid
          nullable: true
          description: The note it is placed under, if any.
        child_count:
          type: integer
          description: Live children (notes and links) directly under it.
        pinned:
          type: boolean
        is_encrypted:
          type: boolean
          description: The content is ciphertext produced by the client (it starts with `lnenc:`); the server cannot read it.
        tags:
          $ref: '#/components/schemas/TagNames'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NoteListResponse:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/PageMeta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/NoteListItem'

    CreateLinkRequest:
      type: object
      properties:
        icon:
          type: string
          maxLength: 32
          nullable: true
          description: A single emoji chosen by the user; null means the default icon for the item type.
        title:
          type: string
          minLength: 1
          maxLength: 255
        url:
          type: string
          maxLength: 2048
          description: Absolute http or https URL
        note:
          type: string
          nullable: true
        folder_id:
          type: string
          format: uuid
          nullable: true
        parent_note_id:
          type: string
          format: uuid
          nullable: true
          description: Place it under this note instead of in a folder (never both).
        tags:
          $ref: '#/components/schemas/TagNames'
      required:
        - title
        - url

    UpdateLinkRequest:
      type: object
      properties:
        icon:
          type: string
          maxLength: 32
          nullable: true
          description: A single emoji chosen by the user; null means the default icon for the item type.
        title:
          type: string
          minLength: 1
          maxLength: 255
        url:
          type: string
          maxLength: 2048
        note:
          type: string
          nullable: true
        tags:
          $ref: '#/components/schemas/TagNames'

    MoveLinkRequest:
      type: object
      properties:
        folder_id:
          type: string
          format: uuid
          nullable: true
        parent_note_id:
          type: string
          format: uuid
          nullable: true
          description: Place it under this note instead of in a folder (never both).

    LinkSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        icon:
          type: string
          maxLength: 32
          nullable: true
          description: A single emoji chosen by the user; null means the default icon for the item type.
        title:
          type: string
        url:
          type: string
        note:
          type: string
          nullable: true
        tags:
          $ref: '#/components/schemas/TagNames'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LinkListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        icon:
          type: string
          maxLength: 32
          nullable: true
          description: A single emoji chosen by the user; null means the default icon for the item type.
        title:
          type: string
        url:
          type: string
        note:
          type: string
          nullable: true
        folder_id:
          type: string
          format: uuid
          nullable: true
        parent_note_id:
          type: string
          format: uuid
          nullable: true
          description: The note it is placed under, if any.
        tags:
          $ref: '#/components/schemas/TagNames'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LinkDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        icon:
          type: string
          maxLength: 32
          nullable: true
          description: A single emoji chosen by the user; null means the default icon for the item type.
        title:
          type: string
        url:
          type: string
        note:
          type: string
          nullable: true
        folder_id:
          type: string
          format: uuid
          nullable: true
        parent_note_id:
          type: string
          format: uuid
          nullable: true
          description: The note it is placed under, if any.
        tags:
          $ref: '#/components/schemas/TagNames'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        path:
          $ref: '#/components/schemas/AncestorPath'

    LinkListResponse:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/PageMeta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/LinkListItem'

    SearchResult:
      type: object
      properties:
        type:
          type: string
          enum: [ note, link ]
        id:
          type: string
          format: uuid
        icon:
          type: string
          maxLength: 32
          nullable: true
          description: A single emoji chosen by the user; null means the default icon for the item type.
        title:
          type: string
        snippet:
          type: string
          description: Plain-text excerpt around the first match (may start/end with an ellipsis). Empty for encrypted notes.
        is_encrypted:
          type: boolean
          description: The note content is encrypted by the client. Only its title and tags are searched.
        folder_id:
          type: string
          format: uuid
          nullable: true
        tags:
          $ref: '#/components/schemas/TagNames'
        updated_at:
          type: string
          format: date-time
        url:
          type: string
          nullable: true
          description: Only for links

    SearchResponse:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/PageMeta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'

    TagCount:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer

    TagListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TagCount'

    AncestorPath:
      type: array
      description: >
        Where the item sits, from the root down to its direct parent (the item itself is not included). Folders and
        notes can be mixed, e.g. folder, folder, note, note. Use it for breadcrumbs.
      items:
        type: object
        properties:
          type:
            type: string
            enum: [ folder, note ]
          id:
            type: string
            format: uuid
          title:
            type: string
            description: The folder name for folders, the title for notes.

    NoteChildrenResponse:
      type: object
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/NoteSummary'
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkSummary'
