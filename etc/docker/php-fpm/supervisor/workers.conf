[supervisord]
user=root
logfile=/app/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

[program:send-unprocessed-mails]
user=www-data
command=php bin/console app:send:mails
numprocs=1
startsecs=0
autostart=true
autorestart=true
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/app/var/log/mailer.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
exitcodes=0