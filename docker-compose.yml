services:

  symfony-ddd-core-mysql:
    container_name: librenotes-backend-mysql
    image: 'mysql:8.0'
    working_dir: /app
    volumes:
      - ./etc/docker/mysql/scripts:/docker-entrypoint-initdb.d
      - sqldata:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=symfony-ddd-core
      - MYSQL_USER=core
      - MYSQL_PASSWORD=password
    ports:
      - '3306:3306'

  symfony-ddd-core-phpmyadmin:
    container_name: librenotes-backend-phpmyadmin
    image: 'phpmyadmin:latest'
    environment:
      - PMA_HOST=symfony-ddd-core-mysql
      - PMA_USER=root
      - PMA_PASSWORD=root
    ports:
      - '8080:80'
    depends_on:
      - symfony-ddd-core-mysql

  symfony-ddd-core-api-server:
    container_name: librenotes-backend-api-nginx
    build:
      context: .
      dockerfile: ./etc/docker/nginx/Dockerfile
    ports:
      - "80:80"  # Map port 80 in the container to port 80 on the host
    volumes:
      - ./public:/app/public
    depends_on:
      - symfony-ddd-core-api-php

  symfony-ddd-core-api-php:
    container_name: librenotes-backend-api-php
    build:
      context: .
      dockerfile: ./etc/docker/php-fpm/Dockerfile
    volumes:
      - .:/app
      - ./docker/php-fpm/ssh:/root/.ssh
    #    ports:
    #      - "9000:900"  # Expose port 9003 for Xdebug
    expose:
      - 9003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - symfony-ddd-core-mysql

volumes:
  sqldata:

networks:
  symfony-ddd-core-net:
    name: symfony-ddd-core-net
