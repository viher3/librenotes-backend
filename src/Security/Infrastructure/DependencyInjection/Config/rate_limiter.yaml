framework:
  rate_limiter:
    login_attempts:
      policy: sliding_window
      limit: 5
      interval: '15 minutes'
    token_renew_attempts:
      policy: sliding_window
      limit: 20
      interval: '15 minutes'

when@test:
  framework:
    rate_limiter:
      # Acceptance tests share the test client's IP across many unrelated
      # cases; a production-sized limit would make them fail on request
      # volume instead of on what they're actually asserting.
      login_attempts:
        policy: sliding_window
        limit: 1000
        interval: '15 minutes'
      token_renew_attempts:
        policy: sliding_window
        limit: 1000
        interval: '15 minutes'
