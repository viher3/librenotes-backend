# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
imports:
    - { resource: "parameters.yaml" }
    - { resource: "modules.yaml" }
    - { resource: "./services/" }

services:

    _instanceof:
        App\Core\Domain\Bus\Event\EventHandler:
            tags:
                - { name: messenger.message_handler, bus: event.bus }

        App\Core\Application\Query\QueryHandler:
            tags:
                - { name: messenger.message_handler, bus: query.bus }

        App\Core\Application\Command\CommandHandler:
            tags:
                - { name: messenger.message_handler, bus: default_command.bus }

        App\Core\Application\Command\TransactionalCommandHandler:
            tags:
                - { name: messenger.message_handler, bus: transactional_command.bus }

        App\Notification\Domain\Service\NotificationSender:
            tags: ['app.notification_sender']

    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Infrastructure/Persistence/Doctrine/Type/'

    nelmio_api_doc.describers.config:
        class: App\Core\Infrastructure\Framework\Symfony\Describers\ExternalDocDescriber
        tags:
            - { name: nelmio_api_doc.describer, priority: 1000 }

    App\Core\Infrastructure\Framework\Symfony\EventSubscriber\ApiExceptionSubscriber:
        arguments:
            $debug: '%kernel.debug%'
        tags: [ kernel.event_listener ]

    App\Configuration\Infrastructure\Encryption\SodiumConfigurationValueEncryptor:
        arguments:
            $keysBase64: '%env(json:CONFIGURATION_ENCRYPTION_KEYS)%'
            $currentVersion: '%env(int:CONFIGURATION_ENCRYPTION_KEY_CURRENT_VERSION)%'

    App\Configuration\Infrastructure\Cache\ConfigurationValueCache:
        arguments:
            $cache: '@cache.app'

    App\Notification\Infrastructure\Sender\TaggedNotificationSenderLocator:
        arguments:
            $senders: !tagged_iterator app.notification_sender

    App\Notification\Infrastructure\Sender\SymfonyMailerNotificationSender:
        arguments:
            $fromAddress: '%env(NOTIFICATION_EMAIL_FROM)%'
            $fromName: '%env(NOTIFICATION_EMAIL_FROM_NAME)%'

    App\User\Application\SignUp\SignUpHandler:
        arguments:
            $sendActivationEmail: '%user.send_activation_email%'
            $registrationEnabled: '%user.registration_enabled%'

    App\User\Infrastructure\EventHandler\SymfonyUserPasswordChangedEventHandler:
        arguments:
            # Same switch as the activation email: one flag tells whether the instance can send user emails.
            $emailsEnabled: '%user.send_activation_email%'

    App\User\Infrastructure\Notifier\BusUserNotifier:
        arguments:
            $frontendUrl: '%app.frontend_url%'

    App\Notes\Infrastructure\Storage\LocalFileStorage:
        arguments:
            $storageDir: '%notes.attachments_dir%'
